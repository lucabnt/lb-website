<nav class="blog-tools" aria-label="Blog">
  <a href="{{ "explore/" | relURL }}">Explore / Esplora</a>
  <a href="{{ "search/" | relURL }}">Search / Cerca</a>
</nav>
<div class="language-filter" role="group" aria-label="Lingua / Language" hidden>
  <button type="button" data-language="en" aria-pressed="false">English</button>
  <button type="button" data-language="it" aria-pressed="false">Italiano</button>
</div>
<p class="language-empty" role="status" hidden>Nessun articolo. / No articles.</p>
{{- $filter := resources.Get "js/language-filter.js" | minify | fingerprint }}
<script defer src="{{ $filter.RelPermalink }}" integrity="{{ $filter.Data.Integrity }}" crossorigin="anonymous"></script>
