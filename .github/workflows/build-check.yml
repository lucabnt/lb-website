name: Build check

# Rilancia la stessa identica build di produzione usata da Netlify
# (hugo --gc --minify, con HUGO_ENV=production e HUGO_ENABLEGITINFO) e
# verifica che tutte le pagine pubblicate vengano davvero scritte.
#
# Nasce da un bug intermittente scoperto ad agosto 2026: in alcune build
# quel comando può fallire nel processare 4 post specifici senza far
# fallire l'intera build (Hugo esce comunque con codice 0), lasciando
# quelle pagine assenti dall'output — un 404 silenzioso in produzione,
# mai segnalato da Netlify come errore. "hugo server", usato in sviluppo
# locale, non riproduce il problema.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Il job non scrive nulla nel repository: legge il codice, builda e
# controlla. Restringere i permessi del GITHUB_TOKEN limita il danno nel
# caso una delle action venisse compromessa.
permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con submodule del tema)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # storia completa: serve a HUGO_ENABLEGITINFO per le date dei contenuti
          fetch-depth: 0

      - name: Leggi le versioni pinnate in netlify.toml
        id: versions
        run: |
          hugo_version=$(grep -oP 'HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml)
          node_version=$(grep -oP 'NODE_VERSION\s*=\s*"\K[^"]+' netlify.toml)
          echo "hugo=$hugo_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "Hugo $hugo_version / Node $node_version (da netlify.toml)"

      - name: Installa Hugo Extended
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ steps.versions.outputs.hugo }}
          extended: true

      - name: Installa Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm

      - name: npm ci (asset KaTeX)
        run: npm ci

      - name: Build di produzione (stesso comando di netlify.toml)
        env:
          HUGO_ENV: production
          HUGO_ENABLEGITINFO: "true"
        run: hugo --gc --minify -b "https://lucabontempi.com"

      - name: Verifica che ogni pagina pubblicata sia stata generata
        env:
          HUGO_ENV: production
        run: |
          # L'elenco delle pagine attese lo fornisce Hugo stesso: così
          # draft, contenuti con data futura, contenuti scaduti, slug
          # personalizzati e page bundle sono gestiti automaticamente.
          hugo list published -e production | python3 -c '
          import csv, os, re, sys

          missing, checked = [], 0
          for row in csv.DictReader(sys.stdin):
              permalink = re.sub(r"^[a-z]+://[^/]+", "", row["permalink"] or "")
              if not permalink:
                  continue
              checked += 1
              path = os.path.join("public", permalink.strip("/"), "index.html")
              if not os.path.isfile(path):
                  missing.append((path, row["path"]))

          for path, src in missing:
              print(f"::error file={src}::Pagina mancante nel risultato della build: {path}")
          print(f"Pagine pubblicate attese: {checked} — mancanti: {len(missing)}")

          if not checked:
              print("::error::Nessuna pagina trovata: il controllo non ha funzionato.")
              sys.exit(1)
          sys.exit(1 if missing else 0)
          '

      - name: Link interni rotti (bloccante)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --offline controlla solo i riferimenti locali: nessuna richiesta
          # di rete, quindi deterministico e senza falsi positivi.
          # --root-dir: indispensabile, altrimenti ogni link che parte da "/"
          # (CSS, favicon, pagine interne) risulta irrisolvibile e il job
          # fallirebbe con decine di falsi positivi.
          # static/vendor NON è escluso di proposito: così il controllo
          # verifica anche i font richiamati da katex.min.css, facendo da
          # rete di sicurezza sulla lista di asset copiati da
          # scripts/copy-katex-assets.js. Se un aggiornamento di KaTeX
          # introducesse un file non previsto in quella lista, il job lo
          # segnalerebbe invece di pubblicare un riferimento rotto.
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}/public"
            ./public
          fail: true
          output: lychee-internal.md

      - name: Link esterni rotti (informativo, non bloccante)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Non bloccante: il link rot su siti di terzi non dipende da
          # questo repository e non deve rendere rossa la CI. Il report
          # resta consultabile nel riepilogo del job.
          #
          # Esclusi i pulsanti di condivisione generati dal tema PaperMod
          # (presenti su ogni pagina) e i social: sono decine di richieste
          # per run verso endpoint che non sono contenuto del sito.
          #
          # --root-dir serve anche qui: senza, ogni link che parte da "/"
          # (CSS, favicon, immagini) risulta irrisolvibile e riempie il
          # report di falsi positivi.
          #
          # --accept: oltre ai redirect (alcuni siti rispondono con catene
          # che lychee non segue fino in fondo), accetta anche 403. Molti
          # siti editoriali rispondono 403 ai client automatici in modo
          # intermittente pur essendo perfettamente raggiungibili da un
          # browser: Bloomberg, ad esempio, è risultato prima valido e poi
          # 403 sullo stesso identico link. Il link rot che conta davvero
          # si manifesta con 404/410 o con un errore di rete, che restano
          # segnalati.
          args: >-
            --no-progress
            --max-concurrency 4
            --timeout 20
            --retry-wait-time 5
            --accept 200..=299,301,302,307,308,403,429
            --root-dir "${{ github.workspace }}/public"
            --exclude "^https?://(www\.)?(facebook\.com/sharer|api\.whatsapp\.com/send|telegram\.me/share|reddit\.com/submit|news\.ycombinator\.com/submitlink)"
            --exclude "^https?://(www\.)?(linkedin\.com|x\.com|twitter\.com|instagram\.com)"
            ./public
          fail: true
          output: lychee-external.md
